apiVersion: v1
data:
  01-tables.sql: "\ncreate table person (\n\tid int auto_increment,\n\tname varchar(150)
    not null,\n\tbirthdate date null,\n\tconstraint pk_stars primary key (id)\n);\n\ncreate
    table movie (\n\tid int auto_increment,\n\ttitle varchar(300) not null,\n\tyear
    smallint not null,\n\tduration smallint null,\n\tsynopsis text null,\n\tposter_uri
    varchar(300) null,\n\tcolor varchar(20) null,\n\tpg varchar(15) null,\n\tdirector_id
    int null,\n\tconstraint pk_movie primary key (id),\n\tconstraint uniq_movie UNIQUE(title,
    year),\n\tconstraint chk_movie_year CHECK(year >= 1850)\n);\n\ncreate table play(\n\tmovie_id
    int not null,\n\tactor_id int not null,\n\trole varchar(100),\n\tconstraint pk_play
    primary key(movie_id, actor_id)\n);\n\ncreate table have_genre(\n\tmovie_id int
    not null,\n\tgenre varchar(20) not null\n);\n\nalter table movie add constraint
    fk_movie_director \n\tFOREIGN KEY (director_id)\n\treferences person(id);\nalter
    table play add constraint FK_PLAY_MOVIE \n\tFOREIGN KEY (movie_id)\n\treferences
    movie(id);\nalter table play add constraint FK_PLAY_ACTOR \n\tFOREIGN KEY (actor_id)\n\treferences
    person(id);\nalter table have_genre add constraint FK_HAVE_GENRE \n\tFOREIGN KEY
    (movie_id)\n\treferences movie(id);\n\n\n"
kind: ConfigMap
metadata:
  name: db-init